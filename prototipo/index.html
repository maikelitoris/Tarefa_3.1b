<!DOCTYPE html>
<html lang="pt">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Animalec Admin</title><link rel="stylesheet" href="css/admin.css"></head>
<body class="pagina-login">
<main id="conteudo">
<section class="cartao login" aria-labelledby="t-login">
  <h1 id="t-login"><span aria-hidden="true">🐾</span> Animalec · Administração</h1>
  <p>Área reservada. Entre com a sua conta de administrador.</p>
  <form action="admin.html" method="get">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required autocomplete="username" placeholder="admin@animalec.pt">
    <label for="pw">Palavra-passe</label>
    <input id="pw" name="pw" type="password" required minlength="8" autocomplete="current-password">
    <button type="submit" class="btn primario">Entrar</button>
  </form>
  <p class="nota">Protótipo: qualquer email válido e uma palavra-passe com 8 ou mais caracteres abrem o painel.</p>
</section>
</main>
</body></html>
